<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Portada</title>
    <link rel="stylesheet" href="../static/css/styles.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-image: url('../static/img/fondo.gif');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            background-color: rgba(200, 200, 200, 0.8);
            border-radius: 10px;
            padding: 20px;
        }

        .buttons {
            margin-top: 50px;
        }

        button {
            margin: 5px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1 class="title" style="color:#fee2ff; font-size:50px">Reciclaje de dispositivos electrónicos</h1>
    <div class="buttons">
        <button onclick="location.href='agregar-donacion.html'" id="agregar-donacion" type="button">Agregar Donación</button>
        <button onclick="location.href='ver-dispositivos.html'" id="ver-dispositivos" type="button">Ver Dispositivos</button>
    </div>
</div>
</body>
</html>
